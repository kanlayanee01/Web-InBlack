name: inblack-topup

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql://inblack:${POSTGRES_PASSWORD:-inblack_dev_only}@postgres:5432/inblack
  REDIS_URL: redis://redis:6379/0
  ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS:-900}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_inblackm_2026}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin-Test-2026}

x-api: &api
  build:
    context: ./backend
    target: runtime
  image: inblack-backend
  restart: always
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: inblack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inblack_dev_only}
      POSTGRES_DB: inblack
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inblack -d inblack"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    restart: always
    ports:
      - "8025:8025"

  migrate:
    build:
      context: ./backend
      target: runtime
    image: inblack-backend
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-1:
    <<: *api
    environment:
      <<: *backend-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *backend-env
      INSTANCE_ID: api-2

  proxy:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-8088}:80"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  tester:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: inblack-backend-test
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
