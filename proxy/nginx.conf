worker_processes auto;
worker_rlimit_nofile 20000;

events {
    # Each proxied request uses two connections, so the default of 1024 only covers ~500 clients.
    worker_connections 10000;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api {
        # Round-robin is nginx's default. "resolve" re-reads Docker DNS, so a container that comes
        # back with a new IP after being killed is picked up without restarting nginx.
        zone api 64k;
        server api-1:8000 resolve max_fails=1 fail_timeout=2s;
        server api-2:8000 resolve max_fails=1 fail_timeout=2s;
    }

    upstream web {
        zone web 64k;
        server web:3000 resolve;
    }

    log_format json_access escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
        '"path":"$uri","status":$status,"duration":$request_time,"upstream":"$upstream_addr"}';

    map $uri $robots_tag {
        default "";
        ~^/admin "noindex, nofollow";
        ~^/[a-z][a-z]/(track|my-orders|checkout) "noindex, nofollow";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        access_log /dev/stdout json_access;
        client_max_body_size 5m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;

        # A POST that may have reached a replica is never replayed on the other one.
        proxy_next_upstream error timeout;

        # SSE: no buffering, and connections stay open.
        location ~ ^/api/v1/orders/[^/]+/events$ {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/ {
            proxy_pass http://api;
        }

        location ~ ^/(healthz|readyz|metrics)$ {
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://web;

            # Strict CSP on pages that stay static (SSG/ISR). A nonce set inside Next.js would
            # force dynamic rendering, so it is stamped onto every <script> tag here instead.
            # Text from users cannot match, because React escapes "<" in anything it renders.
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '<script' '<script nonce="$request_id"';

            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Robots-Tag $robots_tag always;
        }
    }
}
