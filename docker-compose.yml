name: inblack-topup

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql://inblack:${POSTGRES_PASSWORD:-inblack_dev_only}@postgres:5432/inblack
  REDIS_URL: redis://redis:6379/0
  ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS:-900}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_inblackm_2026}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin-Test-2026}
  SESSION_SECRET: ${SESSION_SECRET:-dev_only_session_secret_change_me}

x-api: &api
  build:
    context: ./backend
    target: runtime
  image: inblack-backend
  restart: always
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: inblack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inblack_dev_only}
      POSTGRES_DB: inblack
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inblack -d inblack"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    restart: always
    ports:
      - "8025:8025"

  migrate:
    build:
      context: ./backend
      target: runtime
    image: inblack-backend
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-1:
    <<: *api
    environment:
      <<: *backend-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *backend-env
      INSTANCE_ID: api-2

  worker:
    build:
      context: ./backend
      target: runtime
    image: inblack-backend
    restart: always
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  mock-game:
    build: ./mock-game
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-development}
      FAIL_RATE: ${FAIL_RATE:-0}
      TIMEOUT_RATE: ${TIMEOUT_RATE:-0}
      SUCCESS_BUT_TIMEOUT_RATE: ${SUCCESS_BUT_TIMEOUT_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-0}
    volumes:
      - mock-game-data:/data
    ports:
      - "${MOCK_GAME_PORT:-8091}:8000"
    healthcheck: &python-health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-pay:
    build: ./mock-pay
    restart: always
    environment:
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_inblackm_2026}
      WEBHOOK_URL: http://proxy/api/v1/webhooks/payment
    volumes:
      - mock-pay-data:/data
    ports:
      - "${MOCK_PAY_PORT:-8090}:8000"
    healthcheck: *python-health

  web:
    build: ./web
    restart: always
    environment:
      API_INTERNAL_URL: http://proxy
      SITE_URL: ${SITE_URL:-http://localhost:8088}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/th/track').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  proxy:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PROXY_PORT:-8088}:80"
    depends_on:
      web:
        condition: service_healthy
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  tester:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: inblack-backend-test
    volumes:
      - ./openapi.yaml:/srv/openapi.yaml:ro
    environment:
      <<: *backend-env
      API_BASE_URL: http://proxy
      MOCK_GAME_TEST_URL: http://mock-game:8000
      MOCK_PAY_TEST_URL: http://mock-pay:8000
      API_1_URL: http://api-1:8000
      API_2_URL: http://api-2:8000
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      migrate:
        condition: service_completed_successfully

  e2e:
    profiles: ["e2e"]
    build: ./e2e
    image: inblack-e2e
    environment:
      ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin-Test-2026}
    depends_on:
      proxy:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  mock-game-data:
  mock-pay-data:
